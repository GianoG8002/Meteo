<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Meteo Rahhhh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body style="margin: 0; padding: 0; background-color: antiquewhite; text-align: center;">
    <div class="container" style="margin: 1rem auto; background-color: #fff; padding: 3rem; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);">
        <h1 style="margin-bottom: 2rem;">Previsioni del meteo</h1>
        <div class="row justify-content-center" id="pot" style="text-align: center; margin-bottom: 2rem;">
            <div class="col">
                <h3>Inserisci luogo</h3>
            </div>
            <div class="col" style="margin-top: 0.3rem;">
                <input id="city" style="border: none; width: 100%; text-align: center; font-weight: bold; font-size: larger;" placeholder="Luogo">
            </div>
            <div class="col" style="margin-top: 0.3rem;">
                <button onclick=coords() style="width: 100%; border: none; border-radius: 1rem; background-color: darkred; color: #fff; font-weight: bold; font-size: larger;">Cerca</button>
            </div>
        </div>
        <div class="row">
            <div id="forecast" class="col justify-content-center" style="display: none;">
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
